<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open WebUI</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#17212f;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
  main{background:white;border:1px solid #e4e7ed;border-radius:20px;padding:36px;width:min(100%,400px);box-shadow:0 12px 48px #17212f0a}
  h1{font-size:26px;margin:12px 0 8px}p{color:#697386;line-height:1.6}img{width:44px;height:44px;border-radius:12px}
  label{display:block;margin:20px 0 8px}input,button{width:100%;padding:12px 14px;font:inherit;border-radius:10px}input{border:1px solid #cfd6e0}
  button{margin-top:24px;background:#17212f;color:white;border:0;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
  #error{color:#b42318;min-height:24px;font-size:14px}footer{margin-top:20px;font-size:12px;color:#697386}a{color:inherit}
</style>
<main>
  <img src="/static/favicon.png" alt="Open WebUI">
  <h1>Open WebUI</h1>
  <p>登录后即可使用模型服务。</p>
  <form id="login">
    <label for="username">账号</label>
    <input id="username" name="username" type="text" autocomplete="username" placeholder="账号或邮箱" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
  <footer>由 <a href="https://github.com/open-webui/open-webui">Open WebUI</a> 提供模型平台</footer>
</main>
<script>
const form=document.getElementById('login'),button=document.getElementById('submit'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;error.textContent='';
  try{
    const username=document.getElementById('username').value.trim();
    const email=username.toLowerCase()==='leo'?'leo@model.local':username;
    const response=await fetch('/api/v1/auths/signin',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:document.getElementById('password').value})
    });
    const session=await response.json();
    if(!response.ok||!session.token)throw new Error(response.status===429?'登录尝试过多，请稍后重试。':'账号或密码不正确。');
    localStorage.setItem('token',session.token);
    document.getElementById('password').value='';
    localStorage.removeItem('redirectPath');
    window.location.replace('/');
  }catch(problem){error.textContent=problem.message||'连接失败，请稍后重试。';}
  finally{button.disabled=false;}
});
</script>
</html>
